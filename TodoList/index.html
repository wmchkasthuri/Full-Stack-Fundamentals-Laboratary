<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">My-To-Do-List</a>
</nav>

<div class="container d-flex justify-content-center mt-4">
    <div class="card shadow border-0 p-5 w-100" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Task Manager</h2>
            <p class="text-muted">Organize your tasks and stay productive.</p>
            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
                <button class="btn btn-primary" id="addTaskBtn" type="button">Add Task</button>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-semibold text-secondary">Your tasks</span>
                <span id="taskCounter" class="badge bg-primary">0 remaining</span>
            </div>
            <div class="btn-group w-100 mb-4" role="group">
                <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>
            <ul id="taskList" class="list-group mb-3">
            </ul>
            <div id="emptyState" class="text-center text-muted">
                <p>No tasks yet. Add your first task!</p>
            </div>
            <div class="text-end">
                <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Clear Completed</button>
            </div>
        </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
